name: ssro-lab-envoy

services:
  envoy:
    image: envoyproxy/envoy:v1.40.1
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "443:10000/udp"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      # The private key must be readable by the image's envoy group (GID 101).
      - /etc/ssro-lab/tls/oss:/etc/envoy/certs:ro
    networks: [ssro-lab]

networks:
  ssro-lab:
    external: true
