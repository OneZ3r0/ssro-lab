name: ssro-lab-oss

services:
  envoy:
    image: envoyproxy/envoy:v1.34.1
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    environment:
      ENVOY_UID: ${ENVOY_UID:-1000}
      ENVOY_GID: ${ENVOY_GID:-1000}
    ports:
      - "${EDGE_BIND_IP:-127.0.0.1}:443:443/udp"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../certs:/etc/envoy/certs:ro
    networks: [backend]

networks:
  backend:
    external: true
    name: ssro-lab
